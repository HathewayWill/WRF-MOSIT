# WRF-MOSIT v2.0.0 | WRF-Python post-processing environment
# This environment is optional and separate from the compiled WRF libraries.
# Version pins are retained from the existing project environment file.
# Keep the file at $HOME/WRF-MOSIT/wrf-python-stable.yml when using the
# installer, as its model-specific setup sections refer to that path.
name: wrf-python
channels:
  - conda-forge
  - defaults
dependencies:
  # Python and WRF-aware scientific I/O
  - python=3.11.5
  # wrf-python 1.3.4.1 imports pkg_resources, removed in setuptools 81+.
  - "setuptools<81"
  - wrf-python=1.3.4.1
  - netcdf4=1.6.3
  - hdf5=1.12.2

  # Numerical analysis and visualization
  - numpy=1.24.2
  - scipy=1.11.2
  - matplotlib=3.6.3
  - pandas=1.5.3
  - xarray=2023.3.0
  - cartopy=0.23.0
  # Required by the installed wrf-python distribution metadata.
  - basemap
  - shapely=1.8.5
  - metpy=1.5.1
  - geopandas=0.14.0
  - fiona=1.9.5
  # PROJ is resolved with Cartopy/pyproj; do not force an untested version.
  - bokeh=3.2.2
  - pillow=9.4.0
  - requests=2.28.2

  # Other Python packages retained from the existing environment specification.
  # Packages already specified above are not reinstalled through pip.
  - pip
  - pip:
      - attrs==23.1.0
      - click-plugins==1.1.1
      - cligj==0.7.2
      - platformdirs==3.2.0
      - urllib3==1.26.17
      - wget
